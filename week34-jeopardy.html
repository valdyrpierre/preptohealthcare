<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 + 4 Jeopardy Game - Combined Review</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #060CE9;
            min-height: 100vh;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: white;
            font-size: 3em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        
        .score-display {
            background: white;
            color: #060CE9;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.5em;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .game-board {
            max-width: 1800px;
            margin: 0 auto;
            background: black;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-x: auto;
        }
        
        .categories {
            display: grid;
            grid-template-columns: repeat(10, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
            min-width: 1600px;
        }
        
        .category {
            background: #060CE9;
            color: white;
            padding: 20px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 5px;
            text-transform: uppercase;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(140px, 1fr));
            gap: 10px;
            min-width: 1600px;
        }
        
        .question-tile {
            background: #060CE9;
            color: #D69F4C;
            padding: 40px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 2em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid #060CE9;
        }
        
        .question-tile:hover {
            background: #0505B8;
            transform: scale(1.05);
            border-color: #D69F4C;
        }
        
        .question-tile.answered {
            background: #1a1a1a;
            color: #333;
            cursor: default;
        }
        
        .question-tile.answered:hover {
            transform: none;
            border-color: #1a1a1a;
        }

        .question-tile.empty {
            background: #1a1a1a;
            color: #333;
            cursor: default;
            border-color: #1a1a1a;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: #060CE9;
            padding: 50px;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            border: 5px solid #D69F4C;
        }
        
        .modal-value {
            color: #D69F4C;
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .modal-question {
            color: white;
            font-size: 1.8em;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .modal-answer {
            color: #90EE90;
            font-size: 1.5em;
            margin: 30px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            display: none;
        }
        
        .modal-answer.show {
            display: block;
        }
        
        .modal-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .btn-reveal {
            background: #D69F4C;
            color: #060CE9;
        }
        
        .btn-correct {
            background: #28a745;
            color: white;
        }
        
        .btn-incorrect {
            background: #dc3545;
            color: white;
        }
        
        .btn-close {
            background: #6c757d;
            color: white;
        }
        
        .reset-btn {
            background: white;
            color: #060CE9;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            font-weight: bold;
            transition: transform 0.3s ease;
        }
        
        .reset-btn:hover {
            transform: scale(1.05);
        }
        
        .nav-bar {
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
        }
        
        .nav-btn.active {
            background: #28a745;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="week34.html" class="nav-btn">📝 Quiz</a>
            <a href="week34-flashcards.html" class="nav-btn">🎴 Flashcards</a>
            <a href="week34-matching-game.html" class="nav-btn">🎯 Matching</a>
            <a href="week34-jeopardy.html" class="nav-btn active">🎮 Jeopardy</a>
            <a href="week34-memory-game.html" class="nav-btn">🧠 Memory</a>
        </div>
    </nav>

    <header>
        <h1>🎮 WEEK 3 + 4 COMBINED JEOPARDY!</h1>
        <div class="score-display">Score: $<span id="score">0</span></div>
    </header>

    <div class="game-board">
        <div class="categories">
            <div class="category">Informatics</div>
            <div class="category">EBP Basics</div>
            <div class="category">PICOT</div>
            <div class="category">RADAR</div>
            <div class="category">Med Terms</div>
            <div class="category">Stress</div>
            <div class="category">Burnout</div>
            <div class="category">Four A's</div>
            <div class="category">Holistic</div>
            <div class="category">Documentation</div>
        </div>
        
        <div class="questions-grid" id="questionsGrid"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">🔄 New Game</button>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-value" id="modalValue"></div>
            <div class="modal-question" id="modalQuestion"></div>
            <div class="modal-answer" id="modalAnswer"></div>
            <div class="modal-buttons">
                <button class="btn btn-reveal" id="revealBtn" onclick="revealAnswer()">Reveal Answer</button>
                <button class="btn btn-correct" id="correctBtn" onclick="markCorrect()" style="display:none;">✓ Correct</button>
                <button class="btn btn-incorrect" id="incorrectBtn" onclick="markIncorrect()" style="display:none;">✗ Incorrect</button>
                <button class="btn btn-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            {
                name: "Informatics",
                questions: [
                    { value: 100, question: "Informatics helps nurses use technology in this key area of charting", answer: "What is documentation?" },
                    { value: 200, question: "Informatics supports care provision, documentation, and this final step", answer: "What is evaluation of care?" },
                    { value: 300, question: "QSEN competency framework letters", answer: "What is KSA?" },
                    { value: 400, question: "K in KSA", answer: "What is Knowledge?" },
                    { value: 500, question: "S and A in KSA", answer: "What are Skills and Attitudes?" }
                ]
            },
            {
                name: "EBP Basics",
                questions: [
                    { value: 100, question: "EBP means evidence-based this", answer: "What is practice?" },
                    { value: 200, question: "EBP integrates best evidence with clinical expertise and this", answer: "What are patient/family preferences and values?" },
                    { value: 300, question: "EBP decisions are based on best available what", answer: "What is research?" },
                    { value: 400, question: "EBP improves nursing practice and patient ____", answer: "What are outcomes?" },
                    { value: 500, question: "One barrier to EBP", answer: "What is poor EHR integration, lack of research understanding, or time/staffing constraints?" }
                ]
            },
            {
                name: "PICOT",
                questions: [
                    { value: 100, question: "P in PICOT", answer: "What is Patient/Problem?" },
                    { value: 200, question: "I in PICOT", answer: "What is Intervention?" },
                    { value: 300, question: "C in PICOT", answer: "What is Comparison?" },
                    { value: 400, question: "O in PICOT", answer: "What is Outcome?" },
                    { value: 500, question: "T in PICOT", answer: "What is Timeline?" }
                ]
            },
            {
                name: "RADAR",
                questions: [
                    { value: 100, question: "R in RADAR", answer: "What is Rationale?" },
                    { value: 200, question: "A in RADAR", answer: "What is Authority?" },
                    { value: 300, question: "D in RADAR", answer: "What is Date?" },
                    { value: 400, question: "Second A in RADAR", answer: "What is Accuracy?" },
                    { value: 500, question: "Final R in RADAR", answer: "What is Relevance?" }
                ]
            },
            {
                name: "Med Terms",
                questions: [
                    { value: 100, question: "Prefix meaning above, excessive", answer: "What is hyper-?" },
                    { value: 200, question: "Prefix meaning below, low", answer: "What is hypo-?" },
                    { value: 300, question: "Suffix meaning inflammation", answer: "What is -itis?" },
                    { value: 400, question: "Abbreviation for blood pressure", answer: "What is BP?" },
                    { value: 500, question: "Abbreviation meaning nothing by mouth", answer: "What is NPO?" }
                ]
            },
            {
                name: "Stress",
                questions: [
                    { value: 100, question: "Stress is a state of this in mind/body", answer: "What is arousal in response to demands?" },
                    { value: 200, question: "A stressor is a stimulus requiring this", answer: "What is coping or adaptation?" },
                    { value: 300, question: "Stress can increase this vital sign pair", answer: "What are BP and HR?" },
                    { value: 400, question: "Psychological stress symptom: trouble ____", answer: "What is concentrating?" },
                    { value: 500, question: "Organization recognizing healthcare stress significance", answer: "What is NIOSH?" }
                ]
            },
            {
                name: "Burnout",
                questions: [
                    { value: 100, question: "Burnout can reduce this", answer: "What is efficiency?" },
                    { value: 200, question: "Burnout can increase this mood state", answer: "What is irritability?" },
                    { value: 300, question: "Burnout can cause diminished ____", answer: "What is motivation?" },
                    { value: 400, question: "Burnout increases risk of care ____", answer: "What are errors?" },
                    { value: 500, question: "System factor: inadequate ____", answer: "What is staffing?" }
                ]
            },
            {
                name: "Four A's",
                questions: [
                    { value: 100, question: "First A", answer: "What is Avoid?" },
                    { value: 200, question: "Second A", answer: "What is Alter?" },
                    { value: 300, question: "Third A", answer: "What is Adapt?" },
                    { value: 400, question: "Fourth A", answer: "What is Accept?" },
                    { value: 500, question: "Learn to say no belongs to this A", answer: "What is Avoid?" }
                ]
            },
            {
                name: "Holistic",
                questions: [
                    { value: 100, question: "Holistic nursing includes mind, body, spirit, and ____", answer: "What is emotion?" },
                    { value: 200, question: "Conventional care includes meds, surgery, and ____", answer: "What are procedures?" },
                    { value: 300, question: "Integrative health combines conventional and ____ approaches", answer: "What are complementary?" },
                    { value: 400, question: "Key in counseling patients about treatment choices", answer: "What is a therapeutic relationship and evidence-based guidance?" },
                    { value: 500, question: "Self-care supports this in nurses", answer: "What is reduced burnout risk and better well-being?" }
                ]
            },
            {
                name: "Documentation",
                questions: [
                    { value: 100, question: "I&O stands for ____ and output", answer: "What is intake?" },
                    { value: 200, question: "Accurate I&O supports safe fluid ____", answer: "What is balance management?" },
                    { value: 300, question: "Military time for 2:30 PM", answer: "What is 1430?" },
                    { value: 400, question: "Military time for 6:30 AM", answer: "What is 0630?" },
                    { value: 500, question: "Standard time for 1800", answer: "What is 6:00 PM?" }
                ]
            }
        ];

        let score = 0;
        let currentQuestion = null;
        let answeredQuestions = new Set();

        function initGame() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            const maxQuestions = Math.max(...categories.map(category => category.questions.length));

            for (let i = 0; i < maxQuestions; i++) {
                categories.forEach((category, catIndex) => {
                    const questionData = category.questions[i];
                    const tile = document.createElement('div');

                    if (!questionData) {
                        tile.className = 'question-tile empty';
                        tile.textContent = 'N/A';
                        grid.appendChild(tile);
                        return;
                    }

                    tile.className = 'question-tile';
                    tile.textContent = `$${questionData.value}`;
                    tile.dataset.category = catIndex;
                    tile.dataset.question = i;
                    tile.onclick = () => openQuestion(catIndex, i, tile);
                    grid.appendChild(tile);
                });
            }
            
            score = 0;
            answeredQuestions.clear();
            updateScore();
        }

        function openQuestion(catIndex, qIndex, tile) {
            if (tile.classList.contains('answered')) return;
            
            currentQuestion = {
                category: catIndex,
                index: qIndex,
                tile: tile,
                data: categories[catIndex].questions[qIndex]
            };
            
            document.getElementById('modalValue').textContent = `$${currentQuestion.data.value}`;
            document.getElementById('modalQuestion').textContent = currentQuestion.data.question;
            document.getElementById('modalAnswer').textContent = currentQuestion.data.answer;
            document.getElementById('modalAnswer').classList.remove('show');
            
            document.getElementById('revealBtn').style.display = 'inline-block';
            document.getElementById('correctBtn').style.display = 'none';
            document.getElementById('incorrectBtn').style.display = 'none';
            
            document.getElementById('modal').classList.add('show');
        }

        function revealAnswer() {
            document.getElementById('modalAnswer').classList.add('show');
            document.getElementById('revealBtn').style.display = 'none';
            document.getElementById('correctBtn').style.display = 'inline-block';
            document.getElementById('incorrectBtn').style.display = 'inline-block';
        }

        function markCorrect() {
            score += currentQuestion.data.value;
            updateScore();
            currentQuestion.tile.classList.add('answered');
            answeredQuestions.add(`${currentQuestion.category}-${currentQuestion.index}`);
            closeModal();
        }

        function markIncorrect() {
            score -= currentQuestion.data.value;
            updateScore();
            currentQuestion.tile.classList.add('answered');
            answeredQuestions.add(`${currentQuestion.category}-${currentQuestion.index}`);
            closeModal();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        function resetGame() {
            initGame();
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize game
        initGame();
    </script>
</body>
</html>
