<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 + 9 Jeopardy Game - Combined Review</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #060CE9;
            min-height: 100vh;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: white;
            font-size: 3em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        
        .score-display {
            background: white;
            color: #060CE9;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.5em;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .game-board {
            max-width: 1800px;
            margin: 0 auto;
            background: black;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-x: auto;
        }
        
        .categories {
            display: grid;
            grid-template-columns: repeat(10, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
            min-width: 1600px;
        }
        
        .category {
            background: #060CE9;
            color: white;
            padding: 20px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 5px;
            text-transform: uppercase;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(140px, 1fr));
            gap: 10px;
            min-width: 1600px;
        }
        
        .question-tile {
            background: #060CE9;
            color: #D69F4C;
            padding: 40px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 2em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid #060CE9;
        }
        
        .question-tile:hover {
            background: #0505B8;
            transform: scale(1.05);
            border-color: #D69F4C;
        }
        
        .question-tile.answered {
            background: #1a1a1a;
            color: #333;
            cursor: default;
        }
        
        .question-tile.answered:hover {
            transform: none;
            border-color: #1a1a1a;
        }

        .question-tile.empty {
            background: #1a1a1a;
            color: #333;
            cursor: default;
            border-color: #1a1a1a;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: #060CE9;
            padding: 50px;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            border: 5px solid #D69F4C;
        }
        
        .modal-value {
            color: #D69F4C;
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .modal-question {
            color: white;
            font-size: 1.8em;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .modal-answer {
            color: #90EE90;
            font-size: 1.5em;
            margin: 30px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            display: none;
        }
        
        .modal-answer.show {
            display: block;
        }
        
        .modal-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .btn-reveal {
            background: #D69F4C;
            color: #060CE9;
        }
        
        .btn-correct {
            background: #28a745;
            color: white;
        }
        
        .btn-incorrect {
            background: #dc3545;
            color: white;
        }
        
        .btn-close {
            background: #6c757d;
            color: white;
        }
        
        .reset-btn {
            background: white;
            color: #060CE9;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            font-weight: bold;
            transition: transform 0.3s ease;
        }
        
        .reset-btn:hover {
            transform: scale(1.05);
        }
        
        .nav-bar {
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
        }
        
        .nav-btn.active {
            background: #28a745;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="week89.html" class="nav-btn">Quiz</a>
            <a href="week89-flashcards.html" class="nav-btn">Flashcards</a>
            <a href="week89-matching-game.html" class="nav-btn">Matching</a>
            <a href="week89-jeopardy.html" class="nav-btn active">Jeopardy</a>
            <a href="week89-memory-game.html" class="nav-btn">Memory</a>
        </div>
    </nav>

    <header>
        <h1>WEEK 8 + 9 COMBINED JEOPARDY</h1>
        <div class="score-display">Score: $<span id="score">0</span></div>
    </header>

    <div class="game-board">
        <div class="categories">
            <div class="category">Safety</div>
            <div class="category">Med Errors</div>
            <div class="category">Joint Comm</div>
            <div class="category">Just Culture</div>
            <div class="category">QI Tools</div>
            <div class="category">IOM/QSEN</div>
            <div class="category">Incivility</div>
            <div class="category">Violence Types</div>
            <div class="category">Impact</div>
            <div class="category">ANA Action</div>
        </div>
        
        <div class="questions-grid" id="questionsGrid"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">🔄 New Game</button>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-value" id="modalValue"></div>
            <div class="modal-question" id="modalQuestion"></div>
            <div class="modal-answer" id="modalAnswer"></div>
            <div class="modal-buttons">
                <button class="btn btn-reveal" id="revealBtn" onclick="revealAnswer()">Reveal Answer</button>
                <button class="btn btn-correct" id="correctBtn" onclick="markCorrect()" style="display:none;">✓ Correct</button>
                <button class="btn btn-incorrect" id="incorrectBtn" onclick="markIncorrect()" style="display:none;">✗ Incorrect</button>
                <button class="btn btn-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            {
                name: "Safety",
                questions: [
                    { value: 100, question: "Safety means minimizing this through systems and performance", answer: "What is risk of harm?" },
                    { value: 200, question: "IOM says patients rely on healthcare for this and well-being", answer: "What is safety?" },
                    { value: 300, question: "Preventable medical errors are estimated as this leading cause of death", answer: "What is third?" },
                    { value: 400, question: "An event causing death or permanent harm", answer: "What is a sentinel event?" },
                    { value: 500, question: "Error that should never occur", answer: "What is a never event?" }
                ]
            },
            {
                name: "Med Errors",
                questions: [
                    { value: 100, question: "Error type: action not taken", answer: "What is omission?" },
                    { value: 200, question: "Error type: wrong action taken", answer: "What is commission?" },
                    { value: 300, question: "Category tied to wrong medication pump", answer: "What is device/product error?" },
                    { value: 400, question: "Category related to unsafe room setup", answer: "What is environmental error?" },
                    { value: 500, question: "Category related to wrong-site operation", answer: "What is surgical error?" }
                ]
            },
            {
                name: "Joint Comm",
                questions: [
                    { value: 100, question: "The Joint Commission is this type of organization", answer: "What is independent not-for-profit?" },
                    { value: 200, question: "Gold Seal of Approval comes from this body", answer: "What is The Joint Commission?" },
                    { value: 300, question: "Most accreditation survey cycle", answer: "What is every three years?" },
                    { value: 400, question: "Laboratory survey cycle", answer: "What is every two years?" },
                    { value: 500, question: "Document filed after in-hospital accident", answer: "What is an incident report?" }
                ]
            },
            {
                name: "Just Culture",
                questions: [
                    { value: 100, question: "Just culture is this type of environment", answer: "What is accountable and non-punitive?" },
                    { value: 200, question: "This approach is rejected: blame and ____", answer: "What is shame?" },
                    { value: 300, question: "Professionals are not blamed for this", answer: "What are system problems?" },
                    { value: 400, question: "Behavior still not tolerated", answer: "What is reckless behavior?" },
                    { value: 500, question: "Unsafe shortcuts are called", answer: "What are unhealthy norms/work-arounds?" }
                ]
            },
            {
                name: "QI Tools",
                questions: [
                    { value: 100, question: "QI uses this to monitor outcomes", answer: "What is data?" },
                    { value: 200, question: "Non-interchangeable tubing is", answer: "What is mistake proofing?" },
                    { value: 300, question: "Surgical checklist process", answer: "What is Universal Protocol?" },
                    { value: 400, question: "Two-RN blood check is this tool", answer: "What is successive checks?" },
                    { value: 500, question: "Communication framework", answer: "What is SBAR?" }
                ]
            },
            {
                name: "IOM/QSEN",
                questions: [
                    { value: 100, question: "IOM aim focused on fairness", answer: "What is equity?" },
                    { value: 200, question: "IOM aim focused on delays", answer: "What is timeliness?" },
                    { value: 300, question: "QSEN competency: using evidence", answer: "What is evidence-based practice?" },
                    { value: 400, question: "QSEN competency: digital systems use", answer: "What is informatics?" },
                    { value: 500, question: "QSEN competency emphasizing safety systems", answer: "What is safety?" }
                ]
            },
            {
                name: "Incivility",
                questions: [
                    { value: 100, question: "Incivility includes rude or disrespectful ____", answer: "What are actions?" },
                    { value: 200, question: "Bullying is repeated, unwanted, and ____", answer: "What is harmful?" },
                    { value: 300, question: "Theory explaining inward aggression in nursing", answer: "What is Oppressed Group Theory?" },
                    { value: 400, question: "Power imbalance can lead to this", answer: "What is assertion through aggression?" },
                    { value: 500, question: "A communication style linked with lateral violence", answer: "What is passive-aggressive communication?" }
                ]
            },
            {
                name: "Violence Types",
                questions: [
                    { value: 100, question: "Type 1 violence", answer: "What is criminal intent?" },
                    { value: 200, question: "Most common healthcare assault type", answer: "What is customer/client?" },
                    { value: 300, question: "Type 3 violence", answer: "What is worker-on-worker?" },
                    { value: 400, question: "Type 4 violence", answer: "What is personal relationship?" },
                    { value: 500, question: "Worker-on-worker is often known as", answer: "What is bullying?" }
                ]
            },
            {
                name: "Impact",
                questions: [
                    { value: 100, question: "Physical symptom: interrupted ____", answer: "What is sleep?" },
                    { value: 200, question: "GI symptom often reported", answer: "What are intestinal problems?" },
                    { value: 300, question: "Psych effect: increased ____", answer: "What is anxiety?" },
                    { value: 400, question: "Care consequence", answer: "What is impaired clinical judgment?" },
                    { value: 500, question: "Workforce impact", answer: "What is increased attrition and faculty shortage?" }
                ]
            },
            {
                name: "ANA Action",
                questions: [
                    { value: 100, question: "ANA stance on violence", answer: "What is zero tolerance?" },
                    { value: 200, question: "Nurses and employers should build this", answer: "What is a culture of respect?" },
                    { value: 300, question: "Strategies should be this type", answer: "What is evidence-based?" },
                    { value: 400, question: "Prevention levels in ANA statement", answer: "What are primary, secondary, tertiary?" },
                    { value: 500, question: "ANA statement relevance", answer: "What is all healthcare professionals and stakeholders?" }
                ]
            }
        ];

        let score = 0;
        let currentQuestion = null;
        let answeredQuestions = new Set();

        function initGame() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            const maxQuestions = Math.max(...categories.map(category => category.questions.length));

            for (let i = 0; i < maxQuestions; i++) {
                categories.forEach((category, catIndex) => {
                    const questionData = category.questions[i];
                    const tile = document.createElement('div');

                    if (!questionData) {
                        tile.className = 'question-tile empty';
                        tile.textContent = 'N/A';
                        grid.appendChild(tile);
                        return;
                    }

                    tile.className = 'question-tile';
                    tile.textContent = `$${questionData.value}`;
                    tile.dataset.category = catIndex;
                    tile.dataset.question = i;
                    tile.onclick = () => openQuestion(catIndex, i, tile);
                    grid.appendChild(tile);
                });
            }
            
            score = 0;
            answeredQuestions.clear();
            updateScore();
        }

        function openQuestion(catIndex, qIndex, tile) {
            if (tile.classList.contains('answered')) return;
            
            currentQuestion = {
                category: catIndex,
                index: qIndex,
                tile: tile,
                data: categories[catIndex].questions[qIndex]
            };
            
            document.getElementById('modalValue').textContent = `$${currentQuestion.data.value}`;
            document.getElementById('modalQuestion').textContent = currentQuestion.data.question;
            document.getElementById('modalAnswer').textContent = currentQuestion.data.answer;
            document.getElementById('modalAnswer').classList.remove('show');
            
            document.getElementById('revealBtn').style.display = 'inline-block';
            document.getElementById('correctBtn').style.display = 'none';
            document.getElementById('incorrectBtn').style.display = 'none';
            
            document.getElementById('modal').classList.add('show');
        }

        function revealAnswer() {
            document.getElementById('modalAnswer').classList.add('show');
            document.getElementById('revealBtn').style.display = 'none';
            document.getElementById('correctBtn').style.display = 'inline-block';
            document.getElementById('incorrectBtn').style.display = 'inline-block';
        }

        function markCorrect() {
            score += currentQuestion.data.value;
            updateScore();
            currentQuestion.tile.classList.add('answered');
            answeredQuestions.add(`${currentQuestion.category}-${currentQuestion.index}`);
            closeModal();
        }

        function markIncorrect() {
            score -= currentQuestion.data.value;
            updateScore();
            currentQuestion.tile.classList.add('answered');
            answeredQuestions.add(`${currentQuestion.category}-${currentQuestion.index}`);
            closeModal();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        function resetGame() {
            initGame();
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize game
        initGame();
    </script>
</body>
</html>
