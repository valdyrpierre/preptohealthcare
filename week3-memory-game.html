<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Memory Game - Metric and Household Systems</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
            max-width: 1000px;
            margin: 0 auto 30px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            max-width: 1000px;
            margin: 0 auto 30px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-label {
            color: #666;
            font-size: 1em;
            margin-bottom: 5px;
        }
        
        .stat-value {
            color: #667eea;
            font-size: 2em;
            font-weight: bold;
        }
        
        .game-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .memory-card {
            aspect-ratio: 1;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .memory-card.flipped {
            transform: rotateY(180deg);
        }
        
        .memory-card.matched {
            opacity: 0.6;
            cursor: default;
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 500;
            line-height: 1.3;
        }
        
        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 3em;
        }
        
        .card-back {
            background: white;
            color: #333;
            transform: rotateY(180deg);
            border: 3px solid #667eea;
        }
        
        .reset-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .reset-btn:hover {
            transform: scale(1.05);
        }
        
        .completion-message {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            display: none;
            max-width: 600px;
            margin: 30px auto;
        }
        
        .completion-message.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .completion-message h2 {
            color: #28a745;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .completion-message p {
            color: #666;
            font-size: 1.3em;
            margin: 10px 0;
        }
        
        .timer {
            color: #667eea;
            font-size: 2em;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .memory-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            
            .card-face {
                font-size: 0.7em;
                padding: 10px;
            }
        }
        
        .nav-bar {
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
        }
        
        .nav-btn.active {
            background: #28a745;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="week3.html" class="nav-btn">📝 Quiz</a>
            <a href="week3-flashcards.html" class="nav-btn">🎴 Flashcards</a>
            <a href="week3-matching-game.html" class="nav-btn">🎯 Matching</a>
            <a href="week3-jeopardy.html" class="nav-btn">🎮 Jeopardy</a>
            <a href="week3-memory-game.html" class="nav-btn active">🧠 Memory</a>
        </div>
    </nav>

    <header>
        <h1>🧠 Memory Match Game</h1>
        <p class="subtitle">Match measurement terms, formulas, and conversions from Chapter 2.</p>
    </header>

    <div class="game-container">
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Moves</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Matches</div>
                <div class="stat-value" id="matches">0 / 20</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Time</div>
                <div class="stat-value timer" id="timer">0:00</div>
            </div>
        </div>

        <div class="memory-grid" id="memoryGrid"></div>

        <div class="completion-message" id="completionMessage">
            <h2>🎉 Excellent Memory!</h2>
            <p>You matched all cards!</p>
            <p style="margin-top: 20px;">Moves: <span id="finalMoves"></span></p>
            <p>Time: <span id="finalTime"></span></p>
        </div>

        <button class="reset-btn" onclick="resetGame()">🔄 New Game</button>
    </div>

    <script>
        const cardPairs = [
            { id: 1, content: "1 kg" },
            { id: 1, content: "1000 g" },
            { id: 2, content: "1 g" },
            { id: 2, content: "1000 mg" },
            { id: 3, content: "1 mg" },
            { id: 3, content: "1000 mcg" },
            { id: 4, content: "0.4 g" },
            { id: 4, content: "400 mg" },
            { id: 5, content: "4 mg" },
            { id: 5, content: "4000 mcg" },
            { id: 6, content: "tsp" },
            { id: 6, content: "teaspoon" },
            { id: 7, content: "tbsp" },
            { id: 7, content: "tablespoon" },
            { id: 8, content: "pt" },
            { id: 8, content: "pint" },
            { id: 9, content: "qt" },
            { id: 9, content: "quart" },
            { id: 10, content: "lb" },
            { id: 10, content: "pound" },
            { id: 11, content: "oz / fl oz" },
            { id: 11, content: "ounce / fluid ounce" },
            { id: 12, content: "1 tsp" },
            { id: 12, content: "5 mL" },
            { id: 13, content: "10 mL" },
            { id: 13, content: "2 tsp" },
            { id: 14, content: "°C = (°F − 32) ÷ 1.8" },
            { id: 14, content: "F to C formula" },
            { id: 15, content: "°F = °C × 1.8 + 32" },
            { id: 15, content: "C to F formula" },
            { id: 16, content: "40°C" },
            { id: 16, content: "104°F" },
            { id: 17, content: "g to mg" },
            { id: 17, content: "move decimal 3 places right" },
            { id: 18, content: "Arrow open end" },
            { id: 18, content: "faces larger measure" },
            { id: 19, content: "500 mg" },
            { id: 19, content: "0.5 g" },
            { id: 20, content: "2500 mcg" },
            { id: 20, content: "2.5 mg" }
        ];

        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timerInterval;
        let seconds = 0;

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function initGame() {
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            
            const shuffledCards = shuffle(cardPairs);
            
            shuffledCards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'memory-card';
                cardElement.dataset.id = card.id;
                cardElement.dataset.index = index;
                
                cardElement.innerHTML = `
                    <div class="card-face card-front">?</div>
                    <div class="card-face card-back">${card.content}</div>
                `;
                
                cardElement.onclick = () => flipCard(cardElement);
                grid.appendChild(cardElement);
            });
            
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            seconds = 0;
            
            updateStats();
            document.getElementById('completionMessage').classList.remove('show');
            
            clearInterval(timerInterval);
        }

        function flipCard(card) {
            if (flippedCards.length >= 2) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
            
            // Start timer on first move
            if (moves === 0) {
                startTimer();
            }
            
            card.classList.add('flipped');
            flippedCards.push(card);
            
            if (flippedCards.length === 2) {
                moves++;
                updateStats();
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.dataset.id === card2.dataset.id) {
                // Match found
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    flippedCards = [];
                    matchedPairs++;
                    updateStats();
                    
                    if (matchedPairs === cardPairs.length / 2) {
                        setTimeout(showCompletion, 500);
                    }
                }, 600);
            } else {
                // No match
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 1000);
            }
        }

        function updateStats() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = `${matchedPairs} / ${cardPairs.length / 2}`;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function showCompletion() {
            clearInterval(timerInterval);
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('finalMoves').textContent = moves;
            document.getElementById('finalTime').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            document.getElementById('completionMessage').classList.add('show');
        }

        function resetGame() {
            clearInterval(timerInterval);
            initGame();
        }

        // Initialize game
        initGame();
    </script>
</body>
</html>
