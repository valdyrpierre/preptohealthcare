<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 + 9 Flashcards - Combined Review</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
        }
        
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 700px;
            height: 450px;
            margin: 20px 0;
        }
        
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }
        
        .card-front {
            background: white;
            color: #333;
        }
        
        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: rotateY(180deg);
        }
        
        .card-label {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            opacity: 0.7;
            font-weight: bold;
        }
        
        .card-content {
            font-size: 1.8em;
            line-height: 1.5;
            font-weight: 500;
        }
        
        .card-back .card-content {
            font-size: 1.5em;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            align-items: center;
        }
        
        .btn {
            background: white;
            color: #667eea;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-weight: bold;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn:disabled:hover {
            transform: none;
        }
        
        .counter {
            background: white;
            color: #667eea;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .shuffle-btn {
            background: #28a745;
            color: white;
            margin-top: 10px;
        }
        
        .shuffle-btn:hover {
            background: #218838;
        }
        
        .hint {
            background: rgba(255,255,255,0.95);
            color: #666;
            padding: 15px 25px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.1em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 700px;
        }
        
        .progress-bar {
            width: 100%;
            max-width: 700px;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s ease;
        }
        
        .nav-bar {
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
        }
        
        .nav-btn.active {
            background: #28a745;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="week89.html" class="nav-btn">Quiz</a>
            <a href="week89-flashcards.html" class="nav-btn active">Flashcards</a>
            <a href="week89-matching-game.html" class="nav-btn">Matching</a>
            <a href="week89-jeopardy.html" class="nav-btn">Jeopardy</a>
            <a href="week89-memory-game.html" class="nav-btn">Memory</a>
        </div>
    </nav>

    <header>
        <h1>Week 8 + 9 Flashcards</h1>
        <p class="subtitle">Safety and Quality Improvement + Incivility and Conflict Resolution</p>
    </header>

    <div class="flashcard-container">
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
                <div class="card-label">Question</div>
                <div class="card-content" id="question"></div>
            </div>
            <div class="card-face card-back">
                <div class="card-label">Answer</div>
                <div class="card-content" id="answer"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="prevBtn" onclick="previousCard()">← Previous</button>
        <div class="counter" id="counter">1 / 40</div>
        <button class="btn" id="nextBtn" onclick="nextCard()">Next →</button>
    </div>

    <button class="btn shuffle-btn" onclick="shuffleCards()">🔀 Shuffle Cards</button>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="hint">💡 Tip: Click on the card to flip it and reveal the answer!</div>

    <script>
        const flashcards = [
            { question: "Define patient safety.", answer: "Minimizing risk of harm to patients and providers through system effectiveness and individual performance." },
            { question: "What does IOM say patients must rely on healthcare institutions for?", answer: "Safety and well-being." },
            { question: "What is a medical error?", answer: "A preventable adverse effect of care that may or may not be evident or harmful." },
            { question: "Define sentinel event.", answer: "A patient safety event that results in death, permanent harm, or severe temporary harm." },
            { question: "Define never event.", answer: "An error that should never have happened." },
            { question: "Errors of omission are:", answer: "Errors caused by actions not taken." },
            { question: "Errors of commission are:", answer: "Errors caused by wrong actions taken." },
            { question: "List common medical error categories.", answer: "Care management, device/product, environmental, patient protective, surgical, radiological." },
            { question: "What is The Joint Commission mission?", answer: "Improve healthcare quality and safety through evaluation and accreditation." },
            { question: "How often are most organizations surveyed by The Joint Commission?", answer: "At least every three years." },
            { question: "How often are laboratories surveyed?", answer: "Every two years." },
            { question: "What report is required after an accident or injury in hospital?", answer: "An incident report." },
            { question: "Define just culture.", answer: "A fair, accountable approach that evaluates error type instead of automatic blame." },
            { question: "What behavior is not tolerated in just culture?", answer: "Reckless behavior." },
            { question: "Three behavior types in just culture review.", answer: "Human error, at-risk behavior, reckless behavior." },
            { question: "QI definition in QSEN.", answer: "Using data to monitor outcomes and test changes to continuously improve quality and safety." },
            { question: "What is quality of care?", answer: "The excellence or superiority of healthcare, viewed on a continuum from poor to high quality." },
            { question: "Give a mistake-proofing example.", answer: "Non-interchangeable tubing." },
            { question: "What is successive check example in nursing?", answer: "Two registered nurses verifying blood transfusion information." },
            { question: "SBAR is used for:", answer: "Structured communication." },
            { question: "Care bundles can help prevent:", answer: "Complications such as CLABSI." },
            { question: "CMS quality tracking showed what broad effect?", answer: "Improvement in healthcare outcomes." },
            { question: "List IOM six aims.", answer: "Safety, effectiveness, patient-centeredness, timeliness, efficiency, equity." },
            { question: "QSEN six competencies include:", answer: "Patient-centered care, EBP, safety, teamwork/collaboration, quality improvement, informatics." },
            { question: "Define incivility.", answer: "Rude, discourteous, or disrespectful actions with or without negative intent." },
            { question: "Define bullying.", answer: "Repeated, unwanted, harmful actions intended to humiliate, offend, and distress." },
            { question: "Oppressed Group Theory suggests what pattern?", answer: "Anger and aggression may be directed inward toward peers in lower-power groups." },
            { question: "Most common healthcare workplace violence type.", answer: "Customer/client violence." },
            { question: "Worker-on-worker violence is commonly seen as:", answer: "Bullying." },
            { question: "Criminal intent violence means:", answer: "Perpetrator has no relationship with the victim and acts with crime intent." },
            { question: "Personal relationship workplace violence means:", answer: "Workplace violence tied to an outside personal relationship." },
            { question: "Physical effects of bullying/incivility.", answer: "Headaches, interrupted sleep, intestinal problems." },
            { question: "Psychological effects of bullying/incivility.", answer: "Stress, anxiety, irritability, depressive symptoms." },
            { question: "Impact on care from incivility.", answer: "Impaired clinical judgment and potential safety risks." },
            { question: "One prevention strategy for nurses.", answer: "Commit to healthy interpersonal relationships and professional respect." },
            { question: "What should nurses know about workplace conduct?", answer: "Employer bullying prevention policy and professional codes of conduct." },
            { question: "What support strategy can teams create?", answer: "An agreed-upon signal to seek support when threatened." },
            { question: "ANA position on workplace violence.", answer: "Nursing will not tolerate violence of any kind from any source." },
            { question: "ANA calls for collaboration between whom?", answer: "Nurses and employers to build a culture of respect." },
            { question: "ANA prevention framework levels.", answer: "Primary, secondary, and tertiary prevention." }
        ];

        let currentIndex = 0;
        let isFlipped = false;

        function displayCard() {
            const card = flashcards[currentIndex];
            document.getElementById('question').textContent = card.question;
            document.getElementById('answer').textContent = card.answer;
            document.getElementById('counter').textContent = `${currentIndex + 1} / ${flashcards.length}`;
            
            // Update progress bar
            const progress = ((currentIndex + 1) / flashcards.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            // Update button states
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === flashcards.length - 1;
            
            // Reset flip
            if (isFlipped) {
                document.getElementById('flashcard').classList.remove('flipped');
                isFlipped = false;
            }
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                displayCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                displayCard();
            }
        }

        function shuffleCards() {
            for (let i = flashcards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
            }
            currentIndex = 0;
            displayCard();
        }

        // Flip card on click
        document.getElementById('flashcard').addEventListener('click', function() {
            this.classList.toggle('flipped');
            isFlipped = !isFlipped;
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                previousCard();
            } else if (e.key === ' ') {
                e.preventDefault();
                document.getElementById('flashcard').classList.toggle('flipped');
                isFlipped = !isFlipped;
            }
        });

        // Initialize
        displayCard();
    </script>
</body>
</html>
