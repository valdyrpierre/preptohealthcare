<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Flashcards - Metric and Household Systems</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
        }
        
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 700px;
            height: 450px;
            margin: 20px 0;
        }
        
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }
        
        .card-front {
            background: white;
            color: #333;
        }
        
        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: rotateY(180deg);
        }
        
        .card-label {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            opacity: 0.7;
            font-weight: bold;
        }
        
        .card-content {
            font-size: 1.8em;
            line-height: 1.5;
            font-weight: 500;
        }
        
        .card-back .card-content {
            font-size: 1.5em;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            align-items: center;
        }
        
        .btn {
            background: white;
            color: #667eea;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-weight: bold;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn:disabled:hover {
            transform: none;
        }
        
        .counter {
            background: white;
            color: #667eea;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .shuffle-btn {
            background: #28a745;
            color: white;
            margin-top: 10px;
        }
        
        .shuffle-btn:hover {
            background: #218838;
        }
        
        .hint {
            background: rgba(255,255,255,0.95);
            color: #666;
            padding: 15px 25px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.1em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 700px;
        }
        
        .progress-bar {
            width: 100%;
            max-width: 700px;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s ease;
        }
        
        .nav-bar {
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
        }
        
        .nav-btn.active {
            background: #28a745;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="week3.html" class="nav-btn">📝 Quiz</a>
            <a href="week3-flashcards.html" class="nav-btn active">🎴 Flashcards</a>
            <a href="week3-matching-game.html" class="nav-btn">🎯 Matching</a>
            <a href="week3-jeopardy.html" class="nav-btn">🎮 Jeopardy</a>
            <a href="week3-memory-game.html" class="nav-btn">🧠 Memory</a>
        </div>
    </nav>

    <header>
        <h1>🎴 Week 3 Flashcards</h1>
        <p class="subtitle">Metric and Household Systems of Measurement - Click cards to flip</p>
    </header>

    <div class="flashcard-container">
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
                <div class="card-label">Question</div>
                <div class="card-content" id="question"></div>
            </div>
            <div class="card-face card-back">
                <div class="card-label">Answer</div>
                <div class="card-content" id="answer"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="prevBtn" onclick="previousCard()">← Previous</button>
        <div class="counter" id="counter">1 / 24</div>
        <button class="btn" id="nextBtn" onclick="nextCard()">Next →</button>
    </div>

    <button class="btn shuffle-btn" onclick="shuffleCards()">🔀 Shuffle Cards</button>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="hint">💡 Tip: Click on the card to flip it and reveal the answer!</div>

    <script>
        const flashcards = [
            { question: "What is the basic metric weight chain in order?", answer: "kg > g > mg > mcg" },
            { question: "How many grams are in 1 kilogram?", answer: "1 kg = 1000 g" },
            { question: "How many milligrams are in 1 gram?", answer: "1 g = 1000 mg" },
            { question: "How many micrograms are in 1 milligram?", answer: "1 mg = 1000 mcg" },
            { question: "Which is greater: gram or milligram?", answer: "Gram is greater than milligram" },
            { question: "Convert 0.4 g to mg", answer: "400 mg" },
            { question: "True/False: 4 mg equals 4000 mcg", answer: "True" },
            { question: "For quick conversion arrows, the open part faces which measure?", answer: "The larger measure" },
            { question: "When converting grams to milligrams, the decimal moves how many places?", answer: "3 places to the right" },
            { question: "When converting milligrams to micrograms, the decimal moves how many places?", answer: "3 places to the right" },
            { question: "What does tsp stand for?", answer: "Teaspoon" },
            { question: "What does tbsp stand for?", answer: "Tablespoon" },
            { question: "What does oz (or fl oz) stand for?", answer: "Ounce (fluid ounce)" },
            { question: "What does pt stand for?", answer: "Pint" },
            { question: "What does qt stand for?", answer: "Quart" },
            { question: "What does lb stand for?", answer: "Pound" },
            { question: "How many mL are in 1 tsp?", answer: "1 tsp = 5 mL" },
            { question: "Convert 10 mL to tsp", answer: "2 tsp" },
            { question: "Formula to convert Fahrenheit to Centigrade", answer: "°C = (°F − 32) ÷ 1.8" },
            { question: "Formula to convert Centigrade to Fahrenheit", answer: "°F = °C × 1.8 + 32" },
            { question: "Convert 40°C to °F", answer: "104°F" },
            { question: "Convert 500 mg to g", answer: "0.5 g" },
            { question: "Convert 2500 mcg to mg", answer: "2.5 mg" },
            { question: "What chapter topic is Week 3 focused on?", answer: "Metric and Household Systems of Measurement" }
        ];

        let currentIndex = 0;
        let isFlipped = false;

        function displayCard() {
            const card = flashcards[currentIndex];
            document.getElementById('question').textContent = card.question;
            document.getElementById('answer').textContent = card.answer;
            document.getElementById('counter').textContent = `${currentIndex + 1} / ${flashcards.length}`;
            
            // Update progress bar
            const progress = ((currentIndex + 1) / flashcards.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            // Update button states
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === flashcards.length - 1;
            
            // Reset flip
            if (isFlipped) {
                document.getElementById('flashcard').classList.remove('flipped');
                isFlipped = false;
            }
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                displayCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                displayCard();
            }
        }

        function shuffleCards() {
            for (let i = flashcards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
            }
            currentIndex = 0;
            displayCard();
        }

        // Flip card on click
        document.getElementById('flashcard').addEventListener('click', function() {
            this.classList.toggle('flipped');
            isFlipped = !isFlipped;
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                previousCard();
            } else if (e.key === ' ') {
                e.preventDefault();
                document.getElementById('flashcard').classList.toggle('flipped');
                isFlipped = !isFlipped;
            }
        });

        // Initialize
        displayCard();
    </script>
</body>
</html>
