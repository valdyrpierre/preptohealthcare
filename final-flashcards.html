<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renal Flashcards</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --back: #eaf3fb; --text: #1d2733;
    --muted: #5f6b7a; --accent: #2a6fb0; --good: #2e8b57; --bad: #c0503a; --border: #d8dee6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --card: #1f252d; --back: #1b2a39; --text: #e8edf2;
      --muted: #9aa6b4; --accent: #6aa9e6; --good: #5cc18a; --bad: #e07a63; --border: #2f3843; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 18px; text-align: center; }
  .progress { width: 100%; max-width: 560px; display: flex; justify-content: space-between;
    font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
  .bar { width: 100%; max-width: 560px; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 18px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .scene { width: 100%; max-width: 560px; height: 320px; perspective: 1200px; cursor: pointer; }
  .card { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0,0,0,.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; }
  .front { background: var(--card); }
  .front .term { font-size: 2rem; font-weight: 700; }
  .back { background: var(--back); transform: rotateY(180deg); }
  .back .term-small { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 12px; font-weight: 600; }
  .back .def { font-size: 1.05rem; line-height: 1.55; }
  .hint { color: var(--muted); font-size: .8rem; position: absolute; bottom: 14px; }
  .controls, .grade { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .good { border-color: var(--good); color: var(--good); }
  .bad { border-color: var(--bad); color: var(--bad); }
  .toggle { font-size: .85rem; padding: 8px 14px; }
  .done { text-align: center; padding: 30px; }
  .keys { color: var(--muted); font-size: .78rem; margin-top: 16px; text-align: center; }
  @media (max-width: 480px) { .scene { height: 360px; } .front .term { font-size: 1.6rem; } .back .def { font-size: .98rem; } }
</style>
</head>
<body>
  <h1>Renal Terms — NSG 2200</h1>
  <div class="sub">Chapters 32–35 · Tap the card to flip</div>

  <div class="progress"><span id="count"></span><span id="score"></span></div>
  <div class="bar"><div id="fill"></div></div>

  <div id="area" style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <div class="face front"><div class="term" id="frontText"></div><div class="hint">tap to flip</div></div>
        <div class="face back"><div class="term-small" id="backLabel"></div><div class="def" id="backText"></div></div>
      </div>
    </div>

    <div class="grade">
      <button class="bad" id="again">✗ Still learning</button>
      <button class="good" id="got">✓ Got it</button>
    </div>
    <div class="controls">
      <button id="prev">← Prev</button>
      <button id="shuffle">Shuffle</button>
      <button id="next">Next →</button>
    </div>
    <div class="controls">
      <button class="toggle" id="mode">Mode: Term → Definition</button>
      <button class="toggle" id="restart">Restart all</button>
      <button class="toggle" id="missed">Review missed only</button>
    </div>
    <div class="keys">Keyboard: Space = flip · ← → = navigate · 1 = still learning · 2 = got it</div>
  </div>

<script>
const ALL = [
  ["Azotemia", "Abnormally high levels of nitrogen-containing waste products (mainly BUN and creatinine) in the blood. Usually reflects reduced glomerular filtration; can be prerenal, intrarenal, or postrenal."],
  ["Dysuria", "Painful, burning, or uncomfortable urination. Commonly associated with UTIs, urethritis, or bladder irritation."],
  ["Polyuria", "Excessive urine output (generally > 2.5–3 L/day in adults). Causes include diabetes mellitus, diabetes insipidus, diuretics, and the recovery phase of AKI."],
  ["Oliguria", "Decreased urine output — generally < 400 mL/day (or < 0.5 mL/kg/hr) in adults. Often signals reduced renal perfusion or acute kidney injury."],
  ["Anuria", "Absent or nearly absent urine output — usually < 100 mL/day. Suggests severe kidney failure or complete urinary tract obstruction."],
  ["Uremia", "Clinical syndrome from accumulation of waste products in the blood due to advanced kidney failure. Affects many systems: nausea, vomiting, fatigue, confusion, pruritus, pericarditis, bleeding tendencies."],
  ["Acute Tubular Necrosis (ATN)", "Damage and death of renal tubular epithelial cells. Most common intrarenal cause of AKI; usually caused by ischemia (prolonged low blood flow) or nephrotoxins (e.g., aminoglycosides, contrast dye)."],
  ["Pyelonephritis", "Bacterial infection of the kidney (renal pelvis and parenchyma), usually E. coli ascending from the lower urinary tract. Presents with fever, chills, flank pain, and CVA tenderness."],
  ["Hydronephrosis", "Dilation of the renal pelvis and calyces from urine backing up due to obstruction (stones, tumors, enlarged prostate). Untreated, the pressure can damage kidney tissue."],
  ["Nephrolithiasis", "Formation of stones (calculi) in the kidney. Most are calcium-based; others include uric acid, struvite, and cystine. Stones moving into the ureter cause severe colicky flank pain and hematuria."],
  ["Diuresis", "Increased formation and excretion of urine. Can be natural (high fluid intake), osmotic (e.g., glucose), or caused by diuretic medications."],
  ["Hemodialysis", "Renal replacement therapy where blood is pumped through a dialyzer (artificial kidney with a semipermeable membrane) to remove wastes, excess fluid, and electrolytes, then returned. Typically 3×/week via AV fistula, graft, or catheter."]
];

let deck = ALL.map((c, i) => ({ term: c[0], def: c[1], id: i }));
let idx = 0, reverse = false;
let status = {}; // id -> "got" | "miss"

const $ = id => document.getElementById(id);
const card = $("card");

function render() {
  if (deck.length === 0) {
    $("area").innerHTML = '<div class="done"><h2>Nothing to review 🎉</h2><button onclick="location.reload()">Start over</button></div>';
    return;
  }
  const c = deck[idx];
  card.classList.remove("flipped");
  setTimeout(() => {
    $("frontText").textContent = reverse ? c.def : c.term;
    $("frontText").style.fontSize = reverse ? "1.05rem" : "";
    $("frontText").style.fontWeight = reverse ? "400" : "";
    $("frontText").style.lineHeight = reverse ? "1.55" : "";
    $("backLabel").textContent = reverse ? "Term" : c.term;
    $("backText").textContent = reverse ? c.term : c.def;
    $("backText").style.fontSize = reverse ? "1.8rem" : "";
    $("backText").style.fontWeight = reverse ? "700" : "";
  }, card.classList.contains("flipped") ? 250 : 0);
  $("count").textContent = `Card ${idx + 1} of ${deck.length}`;
  const got = Object.values(status).filter(s => s === "got").length;
  const miss = Object.values(status).filter(s => s === "miss").length;
  $("score").textContent = `✓ ${got}  ·  ✗ ${miss}`;
  $("fill").style.width = ((idx + 1) / deck.length * 100) + "%";
}

function flip() { card.classList.toggle("flipped"); }
function next() { idx = (idx + 1) % deck.length; render(); }
function prev() { idx = (idx - 1 + deck.length) % deck.length; render(); }
function grade(s) { status[deck[idx].id] = s; next(); }

$("scene").onclick = flip;
$("next").onclick = next;
$("prev").onclick = prev;
$("got").onclick = () => grade("got");
$("again").onclick = () => grade("miss");
$("shuffle").onclick = () => {
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  idx = 0; render();
};
$("mode").onclick = () => {
  reverse = !reverse;
  $("mode").textContent = reverse ? "Mode: Definition → Term" : "Mode: Term → Definition";
  render();
};
$("restart").onclick = () => { deck = ALL.map((c, i) => ({ term: c[0], def: c[1], id: i })); status = {}; idx = 0; render(); };
$("missed").onclick = () => {
  const missed = ALL.map((c, i) => ({ term: c[0], def: c[1], id: i })).filter(c => status[c.id] === "miss");
  if (missed.length === 0) { alert("No missed cards yet — mark some as 'Still learning' first."); return; }
  deck = missed; idx = 0; render();
};
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === "1") grade("miss");
  else if (e.key === "2") grade("got");
});
render();
</script>
</body>
</html>
