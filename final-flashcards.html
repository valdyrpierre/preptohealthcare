<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Exam Flashcards - Intro to Nursing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-bar {
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-radius: 12px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .nav-btn:hover { transform: translateY(-2px); }
        .nav-btn.active { background: #28a745; }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            max-width: 860px;
        }

        h1 { color: #667eea; font-size: 2.3em; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.1em; }

        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 760px;
            height: 420px;
            margin: 15px 0;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 36px;
            text-align: center;
        }

        .card-front {
            background: white;
            color: #333;
        }

        .card-back {
            background: linear-gradient(135deg, #2e8b57 0%, #1f6f45 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .card-label {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 18px;
            opacity: 0.75;
            font-weight: bold;
        }

        .card-content {
            font-size: 1.45em;
            line-height: 1.45;
            font-weight: 500;
        }

        .controls {
            display: flex;
            gap: 14px;
            margin-top: 16px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: white;
            color: #667eea;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:disabled:hover { transform: none; }

        .counter {
            background: white;
            color: #667eea;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .shuffle-btn { background: #28a745; color: white; }

        .progress-bar {
            width: 100%;
            max-width: 760px;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 18px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s ease;
        }

        .hint {
            margin-top: 16px;
            background: rgba(255,255,255,0.95);
            color: #444;
            padding: 12px 18px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 760px;
        }

        @media (max-width: 768px) {
            .flashcard-container { height: 360px; }
            .card-content { font-size: 1.15em; }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="final.html" class="nav-btn">Quiz</a>
            <a href="final-flashcards.html" class="nav-btn active">Flashcards</a>
            <a href="final-matching-game.html" class="nav-btn">Matching</a>
            <a href="final-jeopardy.html" class="nav-btn">Jeopardy</a>
            <a href="final-memory-game.html" class="nav-btn">Memory</a>
        </div>
    </nav>

    <header>
        <h1>Final Exam Flashcards</h1>
        <p class="subtitle">Tap card to flip. Review history, practice, ethics, QSEN, research, and terminology.</p>
    </header>

    <div class="flashcard-container">
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
                <div class="card-label">Question</div>
                <div class="card-content" id="question"></div>
            </div>
            <div class="card-face card-back">
                <div class="card-label">Answer</div>
                <div class="card-content" id="answer"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="prevBtn" onclick="previousCard()">Previous</button>
        <div class="counter" id="counter">1 / 40</div>
        <button class="btn" id="nextBtn" onclick="nextCard()">Next</button>
        <button class="btn shuffle-btn" onclick="shuffleCards()">Shuffle</button>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="hint">Tip: Use this for fast recall before your exam.</div>

    <script>
        const flashcards = [
            { question: "Founder of modern nursing?", answer: "Florence Nightingale." },
            { question: "War where Nightingale cut mortality about half?", answer: "Crimean War (1854)." },
            { question: "Book written by Nightingale?", answer: "Notes on Nursing." },
            { question: "Who established Nurse Corps of the US Army?", answer: "Dorothea Dix." },
            { question: "Who founded the American Red Cross?", answer: "Clara Barton." },
            { question: "First African American nurse graduate?", answer: "Mary Mahoney." },
            { question: "Three nursing entry points?", answer: "Diploma, ADN, BSN." },
            { question: "ADN focus?", answer: "2-year program focused on clinical skills in the community." },
            { question: "BSN focus?", answer: "4-year program focused on art and science of nursing." },
            { question: "Scope of nursing practice is guided by what?", answer: "Nurse Practice Act and state law." },
            { question: "Standards of nursing practice define what?", answer: "Minimum acceptable professional nursing behavior." },
            { question: "Main nursing roles?", answer: "Caregiver, advocate, educator, decision-maker, manager/coordinator, communicator, collaborator." },
            { question: "Four nursing responsibilities?", answer: "Promote health, prevent illness, restore health, alleviate suffering." },
            { question: "Healthy People 2030 key goal?", answer: "Healthy thriving lives free of preventable disease and reduced disparities." },
            { question: "Three common causes of healthcare errors?", answer: "Interruptions, poor communication, inadequate knowledge." },
            { question: "Incident report purpose?", answer: "Identify cause of error or unusual event to improve safety." },
            { question: "Human factors causing errors?", answer: "Stress, fatigue, distractions." },
            { question: "QSEN stands for?", answer: "Quality and Safety Education for Nursing." },
            { question: "Six QSEN competencies?", answer: "Patient-centered care, teamwork/collaboration, EBP, QI, safety, informatics." },
            { question: "Fidelity in nursing ethics means?", answer: "Faithfulness to professional obligations and promises to patients." },
            { question: "Autonomy principle means?", answer: "Respecting patient's informed decisions about care." },
            { question: "Justice principle means?", answer: "Providing fair and equitable care." },
            { question: "What is health literacy?", answer: "Ability to obtain, understand, and use health information for decisions." },
            { question: "Interpreter strategy for non-English speakers?", answer: "Use trained interpreters and written information in patient language." },
            { question: "Nursing process steps?", answer: "Assessment, diagnosis, planning, implementation, evaluation." },
            { question: "TeamSTEPPS CUS words?", answer: "Concerned, Uncomfortable, Safety issue." },
            { question: "SBAR words?", answer: "Situation, Background, Assessment, Recommendation." },
            { question: "Evidence-based practice uses what 3 components?", answer: "Research evidence, provider expertise, patient/family values." },
            { question: "Two barriers to EBP?", answer: "Limited time/resources and understaffing." },
            { question: "Critical thinking means?", answer: "Knowing why we do what we do using science." },
            { question: "Clinical judgment means?", answer: "What we do based on science." },
            { question: "RADAR letters?", answer: "Rationale, Authority, Date, Accuracy, Relevance." },
            { question: "PICOT letters?", answer: "Population, Intervention, Comparison, Outcome, Time." },
            { question: "Incivility definition?", answer: "Rude/discourteous/disrespectful actions, with or without intent." },
            { question: "Bullying definition?", answer: "Repeated unwanted harmful actions meant to distress or humiliate." },
            { question: "Tachypnea means?", answer: "Rapid breathing." },
            { question: "Erythema means?", answer: "Redness." },
            { question: "Prefix dys- means?", answer: "Abnormal or painful." },
            { question: "Prefix hypo- means?", answer: "Below." },
            { question: "Suffix -itis means?", answer: "Inflammation." }
        ];

        let currentIndex = 0;
        let isFlipped = false;

        function displayCard() {
            const card = flashcards[currentIndex];
            document.getElementById('question').textContent = card.question;
            document.getElementById('answer').textContent = card.answer;
            document.getElementById('counter').textContent = `${currentIndex + 1} / ${flashcards.length}`;

            const progress = ((currentIndex + 1) / flashcards.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === flashcards.length - 1;

            if (isFlipped) {
                document.getElementById('flashcard').classList.remove('flipped');
                isFlipped = false;
            }
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                displayCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                displayCard();
            }
        }

        function shuffleCards() {
            for (let i = flashcards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
            }
            currentIndex = 0;
            displayCard();
        }

        document.getElementById('flashcard').addEventListener('click', () => {
            document.getElementById('flashcard').classList.toggle('flipped');
            isFlipped = !isFlipped;
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === ' ') {
                e.preventDefault();
                document.getElementById('flashcard').click();
            }
        });

        displayCard();
    </script>
</body>
</html>
