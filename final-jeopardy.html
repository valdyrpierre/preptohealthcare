<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Exam Jeopardy - Intro to Nursing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f8a;
            min-height: 100vh;
            padding: 20px;
        }

        .nav-bar {
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-radius: 12px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .nav-btn:hover { transform: translateY(-2px); }
        .nav-btn.active { background: #28a745; }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: white;
            font-size: 2.6em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            margin-bottom: 10px;
        }

        .score-display {
            background: white;
            color: #0a0f8a;
            padding: 12px 26px;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .game-board {
            max-width: 1800px;
            margin: 0 auto;
            background: #000;
            padding: 18px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-x: auto;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(6, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
            min-width: 1000px;
        }

        .category {
            background: #0a0f8a;
            color: white;
            padding: 16px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1em;
            border-radius: 6px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(160px, 1fr));
            gap: 10px;
            min-width: 1000px;
        }

        .question-tile {
            background: #0a0f8a;
            color: #f1c95a;
            padding: 28px 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.9em;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 3px solid #0a0f8a;
        }

        .question-tile:hover {
            background: #0c12aa;
            transform: scale(1.04);
            border-color: #f1c95a;
        }

        .question-tile.answered {
            background: #1b1b1b;
            color: #333;
            cursor: default;
            border-color: #1b1b1b;
        }

        .question-tile.answered:hover { transform: none; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: #0a0f8a;
            padding: 36px;
            border-radius: 15px;
            max-width: 820px;
            width: 92%;
            text-align: center;
            border: 5px solid #f1c95a;
        }

        .modal-value {
            color: #f1c95a;
            font-size: 2.2em;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .modal-question {
            color: white;
            font-size: 1.45em;
            margin-bottom: 18px;
            line-height: 1.45;
        }

        .modal-answer {
            color: #90ee90;
            font-size: 1.2em;
            margin: 20px 0;
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            display: none;
        }

        .modal-answer.show { display: block; }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 22px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .btn:hover { transform: scale(1.05); }
        .btn-reveal { background: #f1c95a; color: #0a0f8a; }
        .btn-correct { background: #28a745; color: white; display: none; }
        .btn-incorrect { background: #dc3545; color: white; display: none; }
        .btn-close { background: #6c757d; color: white; }

        .reset-btn {
            background: white;
            color: #0a0f8a;
            padding: 13px 32px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            display: block;
            margin: 24px auto;
            font-weight: bold;
            transition: transform 0.25s ease;
        }

        .reset-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="final.html" class="nav-btn">Quiz</a>
            <a href="final-flashcards.html" class="nav-btn">Flashcards</a>
            <a href="final-matching-game.html" class="nav-btn">Matching</a>
            <a href="final-jeopardy.html" class="nav-btn active">Jeopardy</a>
            <a href="final-memory-game.html" class="nav-btn">Memory</a>
        </div>
    </nav>

    <header>
        <h1>Final Exam Jeopardy</h1>
        <div class="score-display">Score: $<span id="score">0</span></div>
    </header>

    <div class="game-board">
        <div class="categories">
            <div class="category">History</div>
            <div class="category">Practice</div>
            <div class="category">QSEN</div>
            <div class="category">Ethics</div>
            <div class="category">Research</div>
            <div class="category">Terminology</div>
        </div>

        <div class="questions-grid" id="questionsGrid"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">New Game</button>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-value" id="modalValue"></div>
            <div class="modal-question" id="modalQuestion"></div>
            <div class="modal-answer" id="modalAnswer"></div>
            <div class="modal-buttons">
                <button class="btn btn-reveal" id="revealBtn" onclick="revealAnswer()">Reveal Answer</button>
                <button class="btn btn-correct" id="correctBtn" onclick="markCorrect()">Correct</button>
                <button class="btn btn-incorrect" id="incorrectBtn" onclick="markIncorrect()">Incorrect</button>
                <button class="btn btn-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            {
                name: 'History',
                questions: [
                    { value: 100, question: 'Founder of modern nursing', answer: 'Who is Florence Nightingale?' },
                    { value: 200, question: 'War where Nightingale reduced mortality by half', answer: 'What is the Crimean War?' },
                    { value: 300, question: 'Founder of American Red Cross', answer: 'Who is Clara Barton?' },
                    { value: 400, question: 'Created Nurse Corps of US Army', answer: 'Who is Dorothea Dix?' },
                    { value: 500, question: 'First African American nurse graduate', answer: 'Who is Mary Mahoney?' }
                ]
            },
            {
                name: 'Practice',
                questions: [
                    { value: 100, question: 'State law defining legal nursing actions', answer: 'What is the Nurse Practice Act?' },
                    { value: 200, question: 'Nursing role that protects patient rights', answer: 'What is patient advocate?' },
                    { value: 300, question: 'Four core responsibilities include promote health and this', answer: 'What is prevent illness / restore health / alleviate suffering?' },
                    { value: 400, question: 'Communication tool: S-B-A-R', answer: 'What is Situation, Background, Assessment, Recommendation?' },
                    { value: 500, question: 'Systematic method: assessment, diagnosis, planning, implementation, and this', answer: 'What is evaluation?' }
                ]
            },
            {
                name: 'QSEN',
                questions: [
                    { value: 100, question: 'QSEN competency: team-based work with shared goals', answer: 'What is teamwork and collaboration?' },
                    { value: 200, question: 'QSEN competency: using current evidence', answer: 'What is evidence-based practice?' },
                    { value: 300, question: 'QSEN competency focused on minimizing harm', answer: 'What is safety?' },
                    { value: 400, question: 'QSEN competency using data for change', answer: 'What is quality improvement?' },
                    { value: 500, question: 'Framework pieces QSEN develops in learners', answer: 'What are knowledge, skills, and attitudes?' }
                ]
            },
            {
                name: 'Ethics',
                questions: [
                    { value: 100, question: 'Principle listed as do no harm in your notes', answer: 'What is beneficence?' },
                    { value: 200, question: 'Being faithful to obligations and promises', answer: 'What is fidelity?' },
                    { value: 300, question: 'Being answerable for your actions', answer: 'What is accountability?' },
                    { value: 400, question: 'Respecting patient right to choose care', answer: 'What is autonomy?' },
                    { value: 500, question: 'Providing fair and equitable care', answer: 'What is justice?' }
                ]
            },
            {
                name: 'Research',
                questions: [
                    { value: 100, question: 'PICOT letter for measured effect', answer: 'What is Outcome (O)?' },
                    { value: 200, question: 'RADAR letter checking recency of source', answer: 'What is Date (D)?' },
                    { value: 300, question: 'Research framework letters in order', answer: 'What is Rationale, Authority, Date, Accuracy, Relevance?' },
                    { value: 400, question: 'EBP combines evidence, expertise, and this', answer: 'What are patient and family values?' },
                    { value: 500, question: 'Two major EBP barriers', answer: 'What are limited time/resources and understaffing?' }
                ]
            },
            {
                name: 'Terminology',
                questions: [
                    { value: 100, question: 'Tachypnea means this', answer: 'What is rapid breathing?' },
                    { value: 200, question: 'Erythema means this', answer: 'What is redness?' },
                    { value: 300, question: 'Prefix dys- means', answer: 'What is abnormal or painful?' },
                    { value: 400, question: 'Suffix -itis means', answer: 'What is inflammation?' },
                    { value: 500, question: 'Prefix hypo- means', answer: 'What is below?' }
                ]
            }
        ];

        const grid = document.getElementById('questionsGrid');
        let score = 0;
        let currentTile = null;

        function buildBoard() {
            grid.innerHTML = '';
            for (let row = 0; row < 5; row++) {
                categories.forEach((category, col) => {
                    const item = category.questions[row];
                    const tile = document.createElement('div');
                    tile.className = 'question-tile';
                    tile.textContent = `$${item.value}`;
                    tile.dataset.row = row;
                    tile.dataset.col = col;
                    tile.onclick = () => openQuestion(tile, category, item);
                    grid.appendChild(tile);
                });
            }
        }

        function openQuestion(tile, category, item) {
            if (tile.classList.contains('answered')) return;
            currentTile = tile;
            document.getElementById('modalValue').textContent = `$${item.value} - ${category.name}`;
            document.getElementById('modalQuestion').textContent = item.question;
            document.getElementById('modalAnswer').textContent = item.answer;
            document.getElementById('modalAnswer').classList.remove('show');
            document.getElementById('revealBtn').style.display = 'inline-block';
            document.getElementById('correctBtn').style.display = 'none';
            document.getElementById('incorrectBtn').style.display = 'none';
            document.getElementById('modal').classList.add('show');
        }

        function revealAnswer() {
            document.getElementById('modalAnswer').classList.add('show');
            document.getElementById('revealBtn').style.display = 'none';
            document.getElementById('correctBtn').style.display = 'inline-block';
            document.getElementById('incorrectBtn').style.display = 'inline-block';
        }

        function markCorrect() {
            const value = Number(document.getElementById('modalValue').textContent.match(/\$(\d+)/)[1]);
            score += value;
            finishQuestion();
        }

        function markIncorrect() {
            const value = Number(document.getElementById('modalValue').textContent.match(/\$(\d+)/)[1]);
            score -= value;
            finishQuestion();
        }

        function finishQuestion() {
            document.getElementById('score').textContent = score;
            if (currentTile) currentTile.classList.add('answered');
            closeModal();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function resetGame() {
            score = 0;
            document.getElementById('score').textContent = score;
            currentTile = null;
            closeModal();
            buildBoard();
        }

        buildBoard();
    </script>
</body>
</html>
