<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 + 4 Flashcards - Combined Review</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
        }
        
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 700px;
            height: 450px;
            margin: 20px 0;
        }
        
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }
        
        .card-front {
            background: white;
            color: #333;
        }
        
        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: rotateY(180deg);
        }
        
        .card-label {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            opacity: 0.7;
            font-weight: bold;
        }
        
        .card-content {
            font-size: 1.8em;
            line-height: 1.5;
            font-weight: 500;
        }
        
        .card-back .card-content {
            font-size: 1.5em;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            align-items: center;
        }
        
        .btn {
            background: white;
            color: #667eea;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-weight: bold;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn:disabled:hover {
            transform: none;
        }
        
        .counter {
            background: white;
            color: #667eea;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .shuffle-btn {
            background: #28a745;
            color: white;
            margin-top: 10px;
        }
        
        .shuffle-btn:hover {
            background: #218838;
        }
        
        .hint {
            background: rgba(255,255,255,0.95);
            color: #666;
            padding: 15px 25px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.1em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 700px;
        }
        
        .progress-bar {
            width: 100%;
            max-width: 700px;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s ease;
        }
        
        .nav-bar {
            background: white;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
        }
        
        .nav-btn.active {
            background: #28a745;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="week34.html" class="nav-btn">📝 Quiz</a>
            <a href="week34-flashcards.html" class="nav-btn active">🎴 Flashcards</a>
            <a href="week34-matching-game.html" class="nav-btn">🎯 Matching</a>
            <a href="week34-jeopardy.html" class="nav-btn">🎮 Jeopardy</a>
            <a href="week34-memory-game.html" class="nav-btn">🧠 Memory</a>
        </div>
    </nav>

    <header>
        <h1>🎴 Week 3 + 4 Flashcards</h1>
        <p class="subtitle">Informatics/EBP + Stress/Holistic Health combined review</p>
    </header>

    <div class="flashcard-container">
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
                <div class="card-label">Question</div>
                <div class="card-content" id="question"></div>
            </div>
            <div class="card-face card-back">
                <div class="card-label">Answer</div>
                <div class="card-content" id="answer"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="prevBtn" onclick="previousCard()">← Previous</button>
        <div class="counter" id="counter">1 / 48</div>
        <button class="btn" id="nextBtn" onclick="nextCard()">Next →</button>
    </div>

    <button class="btn shuffle-btn" onclick="shuffleCards()">🔀 Shuffle Cards</button>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="hint">💡 Tip: Click on the card to flip it and reveal the answer!</div>

    <script>
        const flashcards = [
            { question: "Define nursing informatics.", answer: "Use of technology in the provision, documentation, and evaluation of care." },
            { question: "What framework does QSEN use for informatics and EBP competencies?", answer: "KSA: Knowledge, Skills, and Attitudes." },
            { question: "Define evidence-based practice (EBP).", answer: "Integrating best current evidence with clinical expertise and patient/family values for optimal care." },
            { question: "EBP decision-making is based on what?", answer: "Best available research, with outcomes used to guide decisions." },
            { question: "What does EBP improve?", answer: "Nursing practice and patient outcomes." },
            { question: "Why else is EBP helpful besides success?", answer: "It provides rationale for continuing treatment and supports consistency of outcomes." },
            { question: "Can nurses be researchers?", answer: "Yes, nurses can be researchers." },
            { question: "Name one barrier to EBP use/access.", answer: "Poor integration with electronic health records." },
            { question: "Name another barrier to EBP use/access.", answer: "Lack of understanding of research." },
            { question: "Name a third barrier to EBP use/access.", answer: "Time and staffing constraints." },
            { question: "What model helps formulate good clinical questions?", answer: "The PICO/PICOT model." },
            { question: "PICOT: What does P stand for?", answer: "Patient/Problem." },
            { question: "PICOT: What does I stand for?", answer: "Intervention." },
            { question: "PICOT: What does C stand for?", answer: "Comparison." },
            { question: "PICOT: What does O stand for?", answer: "Outcome." },
            { question: "PICOT: What does T stand for?", answer: "Timeline." },
            { question: "What are the steps in implementing EBP?", answer: "Be curious, ask PICOT, find best research, critically appraise, integrate, evaluate." },
            { question: "RADAR: What does R stand for?", answer: "Rationale." },
            { question: "RADAR: What does A stand for?", answer: "Authority." },
            { question: "RADAR: What does D stand for?", answer: "Date." },
            { question: "RADAR: What does second A stand for?", answer: "Accuracy." },
            { question: "RADAR: What does final R stand for?", answer: "Relevance." },
            { question: "Give examples of common medical prefixes.", answer: "hyper-, hypo-, brady-, tachy-, intra-, inter-, peri-." },
            { question: "Give examples of common healthcare abbreviations.", answer: "BP, HR, RR, O2, PRN, NPO, BID, TID, QID." },
            { question: "Define stress in nursing context.", answer: "Arousal of mind/body in response to demands; both positive and negative change can cause stress." },
            { question: "Define stressor.", answer: "A stimulus or event requiring coping or adaptation." },
            { question: "Name physical signs of stress.", answer: "Increased BP/HR, sweating, muscle aches, fatigue, appetite changes, headaches, GI distress." },
            { question: "Name psychological signs of stress.", answer: "Anxiety, depressed mood, irritability, poor sleep, trouble concentrating." },
            { question: "Why are healthcare environments high stress?", answer: "High stakes, staffing issues, workload, regulations, overtime, and support gaps." },
            { question: "How can burnout affect nursing care?", answer: "Reduced efficiency, poor judgment, accidents, care errors, diminished motivation." },
            { question: "What are the Four A's of stress management?", answer: "Avoid, Alter, Adapt, Accept." },
            { question: "Avoid strategy example", answer: "Learn to say no; avoid unnecessary stressors." },
            { question: "Alter strategy example", answer: "Balance expectations and express feelings." },
            { question: "Adapt strategy example", answer: "Reframe the situation; practice gratitude." },
            { question: "Accept strategy example", answer: "Focus on what you can change and your response." },
            { question: "Holistic nursing addresses which dimensions?", answer: "Mind, body, spirit, and emotion (for both nurse and patient)." },
            { question: "Conventional (allopathic) therapies include", answer: "Medication, surgery, procedures; standardized treatments tested for safety/effectiveness." },
            { question: "Complementary/nonconventional examples", answer: "Nutrition, exercise, stress reduction, CAM approaches." },
            { question: "Integrative health means", answer: "Combining conventional care and complementary approaches appropriately." },
            { question: "Key in counseling patients on treatment choices", answer: "Strong therapeutic relationship, full assessment data, and evidence-based guidance." },
            { question: "Why is self-care essential for nurses?", answer: "Protects well-being and reduces burnout risk, supporting safer patient care." },
            { question: "I&O recording is used to track", answer: "Fluid balance for safe and accurate medical record documentation." },
            { question: "Military time: 2:30 PM", answer: "1430" },
            { question: "Military time: 6:30 AM", answer: "0630" },
            { question: "Standard time: 1800", answer: "6:00 PM" },
            { question: "System with mL, L, g, kg", answer: "Metric system" },
            { question: "Household abbreviation: teaspoon", answer: "tsp" },
            { question: "Household abbreviation: tablespoon", answer: "tbsp" }
        ];

        let currentIndex = 0;
        let isFlipped = false;

        function displayCard() {
            const card = flashcards[currentIndex];
            document.getElementById('question').textContent = card.question;
            document.getElementById('answer').textContent = card.answer;
            document.getElementById('counter').textContent = `${currentIndex + 1} / ${flashcards.length}`;
            
            // Update progress bar
            const progress = ((currentIndex + 1) / flashcards.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            // Update button states
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === flashcards.length - 1;
            
            // Reset flip
            if (isFlipped) {
                document.getElementById('flashcard').classList.remove('flipped');
                isFlipped = false;
            }
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                displayCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                displayCard();
            }
        }

        function shuffleCards() {
            for (let i = flashcards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
            }
            currentIndex = 0;
            displayCard();
        }

        // Flip card on click
        document.getElementById('flashcard').addEventListener('click', function() {
            this.classList.toggle('flipped');
            isFlipped = !isFlipped;
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                previousCard();
            } else if (e.key === ' ') {
                e.preventDefault();
                document.getElementById('flashcard').classList.toggle('flipped');
                isFlipped = !isFlipped;
            }
        });

        // Initialize
        displayCard();
    </script>
</body>
</html>
